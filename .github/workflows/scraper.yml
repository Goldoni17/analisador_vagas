name: Robô de Vagas Diário

on:
  schedule:
    - cron: '0 10 * * *' # Roda todos os dias às 10h da manhã (UTC)
  workflow_dispatch: # Permite rodar manualmente clicando em um botão

jobs:
  atualizar_dados:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar bibliotecas
        run: pip install -r requirements.txt

      - name: Rodar o Extrator de Vagas
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python coletor_vagas.py

      - name: Salvar novos dados no GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add vagas.json
          git commit -m "Atualização automática diária de vagas" || exit 0
          git push